name: Generate Snake

on:
  schedule:
    - cron: "17 3 * * *"  # Daily, UTC, at a non-round minute
  workflow_dispatch:

concurrency:
  group: snake-output
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test grid model and renderer
        run: python3 -m unittest discover -s tests -v

      - name: Generate deterministic BRADY snake artifacts
        run: python3 scripts/brady_snake.py --output-dir dist --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Validate published artifact set
        run: python3 scripts/brady_snake.py --validate dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
