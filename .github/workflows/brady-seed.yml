name: Seed BRADY contribution history

on:
  schedule:
    - cron: "29 3 * * 0" # Weekly, after the current week has rolled over
  workflow_dispatch:
    inputs:
      apply:
        description: "Create and push the planned contribution commits"
        required: true
        default: false
        type: boolean

concurrency:
  group: brady-seed-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
      BRADY_COMMIT_NAME: Brady Giacopelli

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Require profile-wide contribution token
        run: test -n "$PROFILE_GITHUB_TOKEN"

      - name: Plan or apply the rolling contribution seed
        env:
          SHOULD_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [[ "$SHOULD_APPLY" == "true" ]]; then
            python3 scripts/brady_seed.py --apply --summary-file "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/brady_seed.py --summary-file "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push seeded contribution commits
        if: github.event_name == 'schedule' || inputs.apply == true
        run: git push origin HEAD:main
